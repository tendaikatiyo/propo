name: Daily pipeline

# Job TZ aligns shell logs with Africa/Harare. Cron uses timezone below (not UTC).
env:
  TZ: Africa/Harare

on:
  schedule:
    # 04:17 daily — off the hour to avoid GitHub schedule drops at :00
    - cron: "17 4 * * *"
      timezone: "Africa/Harare"
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Secrets live under Settings → Environments → production (not repository secrets).
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log job time
        run: |
          echo "Workflow TZ: ${TZ}"
          echo "Local: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "UTC:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Prepare data directory
        run: mkdir -p data

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/easishop.db
          key: easishop-db-${{ github.run_id }}
          restore-keys: |
            easishop-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Verify Supabase secrets
        run: |
          missing=()
          [ -z "$SUPABASE_URL" ] && missing+=("SUPABASE_URL")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -z "$SUPABASE_DB_URL" ] && missing+=("SUPABASE_DB_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets in environment 'production': ${missing[*]}"
            echo "Add them at: Settings → Environments → production → Environment secrets"
            echo "SUPABASE_DB_URL = Postgres URI from Supabase → Database → Connection string (pooler, port 6543)"
            exit 1
          fi

      - name: Scrape, ingest, and sync Supabase
        run: python -m analytics.run_daily

      - name: Notify Telegram on failure
        if: failure()
        continue-on-error: true
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=propo daily pipeline FAILED (run ${{ github.run_id }})"
