name: Daily propo pipeline

on:
  # Manual runs first — verify scrapers + Supabase before relying on cron.
  workflow_dispatch:
  schedule:
    # 02:00 UTC daily (04:00 CAT). Disable this trigger until a manual run succeeds.
    - cron: "0 2 * * *"

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Restore SQLite history cache
        uses: actions/cache@v4
        with:
          path: data/easishop.db
          key: easishop-db-${{ github.run_number }}
          restore-keys: |
            easishop-db-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Scrape, ingest, and sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m analytics.run_daily
